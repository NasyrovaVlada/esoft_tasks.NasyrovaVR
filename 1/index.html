<!DOCTYPE html>
<html>
<head>
    <title>Домик</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Белый дом, голубые ставни, и комната с видом на реку</h2>
    <div class="house">
        <div class="chimney"></div>
        <div class="roof"></div>
        <div class="walls">
            <div class="window"></div>
            <div class="shutters"></div>
            <div class="shutters" id="right-shutter"></div>
            <div class="stripe"></div>
            <div class="stripe" id="horizontal-stripe"></div>
            <div class="door"></div>
        </div>
    </div>
    <div class="river"></div>
    <div class="bush"></div>
    <div class="bush" id="bush-right"></div>

</body>
</html>
